<style id="maison-motion">
/* Motion: gentle, one idea each. Respects reduced-motion (global rule above). */
@keyframes mHdr{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes mImg{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}

@keyframes mRing{0%{box-shadow:0 8px 22px rgba(0,0,0,.25),0 0 0 0 rgba(31,138,87,.5)}100%{box-shadow:0 8px 22px rgba(0,0,0,.25),0 0 0 20px rgba(31,138,87,0)}}
@keyframes mShine{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes mFade{from{opacity:0}to{opacity:1}}
header{animation:mHdr .8s cubic-bezier(.2,.8,.2,1) both}
/* hero: slow zoom-out on the active slide, staggered text, parallax on the picture */
.sl{transform:scale(1.06);transition:opacity .9s ease,transform 7s ease-out}.sl.on{transform:scale(1)}
.sl.on h1{animation:up 1s cubic-bezier(.2,.8,.2,1) .1s both}.sl.on p{animation:up 1s cubic-bezier(.2,.8,.2,1) .35s both}.sl.on .btn{animation:up 1s cubic-bezier(.2,.8,.2,1) .6s both}

.sl.on .si,.sl.on .e{animation:mFade 1.2s .3s both}
.dots i{transition:width .5s,background .5s}
/* buttons: gold fill sweeps in from the left */
.sl .btn,.card .btn{isolation:isolate}
.sl .btn::before,.card .btn::before{content:"";position:absolute;inset:0;background:var(--ac);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:-1}
.sl .btn:hover::before,.card .btn:hover::before{transform:scaleX(1)}
.card .btn:hover{color:#fff!important;background:transparent!important;border-color:var(--ac)}
/* section headings: gold rule draws itself when revealed */
.sh.in h2::after{animation:mLine .9s .2s cubic-bezier(.2,.8,.2,1) both}
/* product cards: image fades in, second line slides on hover, sale badge gleams */
.im img{animation:mImg 1s cubic-bezier(.2,.8,.2,1) both}
.card .im::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ac);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .im::after{transform:scaleX(1)}
.card .ci2 h3{transition:color .3s,transform .3s}.card:hover .ci2 h3{color:var(--ac);transform:translateX(3px)}
.bd:not(.n):not(.x){background:linear-gradient(110deg,var(--sale) 35%,#d0607c 50%,var(--sale) 65%);background-size:200% 100%;animation:mShine 3.2s linear infinite}
/* categories */
.ct a span{transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .3s,background .3s}.ct a:hover span{transform:translateY(-4px) scale(1.06);background:var(--ac);color:#fff}
.ct a img{transition:transform .5s,box-shadow .5s}.ct a:hover img{transform:scale(1.07);box-shadow:0 0 0 2px var(--ac)}
/* trust strip icons, logo, cart, whatsapp */
.tr div span{transition:transform .5s cubic-bezier(.2,.8,.2,1)}.tr div:hover span{transform:translateY(-5px) rotate(-6deg)}
.logo{transition:letter-spacing .5s,color .3s}.logo:hover{letter-spacing:.04em;color:var(--ac)}
.cb.bump{animation:bump .55s}.cb b{transition:transform .3s}
.wa{animation:mRing 2.6s ease-out infinite}.wa:hover{transform:scale(1.08)}
.ni>a::after{height:1px}
/* drawers and dialogs slide in */
@keyframes mSlide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}@keyframes mPop{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}

const GS="var EMAIL = \"__GMAIL__\";\n\nfunction folder_(sub) {\n  var props = PropertiesService.getScriptProperties();\n  var id = props.getProperty(\"FOLDER_ID\");\n  var root;\n  if (id) { root = DriveApp.getFolderById(id); }\n  else {\n    root = DriveApp.createFolder(\"Isn't Joss Orders\");\n    props.setProperty(\"FOLDER_ID\", root.getId());\n  }\n  var it = root.getFoldersByName(sub);\n  return it.hasNext() ? it.next() : root.createFolder(sub);\n}\n\nfunction clean_(t) {\n  return String(t || \"\").replace(/[\\\\\\/:*?\"<>|]/g, \"-\");\n}\n\nfunction doPost(e) {\n  var d = {};\n  try { d = JSON.parse(e.postData.contents); } catch (err) {}\n  var when = Utilities.formatDate(new Date(), \"Asia/Dhaka\", \"yyyy-MM-dd HH.mm\");\n  if (d.type === \"message\") {\n    var m = \"Date: \" + when + \"\\nName: \" + d.name + \"\\nEmail / Phone: \" + d.email + \"\\n\\nMessage:\\n\" + d.message;\n    folder_(\"Messages\").createFile(\"Message - \" + clean_(d.name) + \" - \" + when + \".txt\", m, MimeType.PLAIN_TEXT);\n    MailApp.sendEmail(EMAIL, \"New message from \" + d.name, m);\n  } else {\n    var o = \"Order ID: \" + d.id + \"\\nDate: \" + when + \"\\nName: \" + d.name + \"\\nPhone: \" + d.phone +\n      \"\\nEmail: \" + d.email + \"\\nAddress: \" + d.address + \"\\n\\nItems: \" + d.items +\n      \"\\nTotal: \" + d.total + \" (Cash on delivery)\";\n    folder_(\"Orders\").createFile(\"Order \" + d.id + \" - \" + clean_(d.name) + \".txt\", o, MimeType.PLAIN_TEXT);\n    MailApp.sendEmail(EMAIL, \"New order \" + d.id, o);\n  }\n\n  if (d.type !== \"message\" && d.email && /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(d.email)) {\n    var store = d.store || \"Our store\";\n    var q = function (t) { return String(t || \"\").replace(/&/g, \"&amp;\").replace(/</g, \"&lt;\"); };\n    var html = '<div style=\"font-family:Arial,sans-serif;max-width:480px;margin:auto;border:1px solid #ddd;border-radius:10px;padding:18px\">' +\n      '<h2 style=\"margin:0\">' + q(store) + '</h2><div style=\"color:#666\">Money Receipt</div><hr>' +\n      '<p><b>Receipt no:</b> ' + q(d.id) + '<br><b>Date:</b> ' + when + '</p>' +\n      '<p><b>Name:</b> ' + q(d.name) + '<br><b>Phone:</b> ' + q(d.phone) + '<br><b>Address:</b> ' + q(d.address) + '</p>' +\n      '<p><b>Items:</b><br>' + q(d.items).split(\"; \").join(\"<br>\") + '</p>' +\n      '<h3>Total: ' + q(d.total) + ' (Cash on delivery)</h3>' +\n      '<p style=\"color:#666\">Thank you for shopping with us!</p></div>';\n    MailApp.sendEmail({ to: d.email, subject: \"Your receipt \" + d.id + \" - \" + store, htmlBody: html, name: store });\n  }\n  return ContentService.createTextOutput(\"ok\");\n}\n\nfunction doGet() {\n  return ContentService.createTextOutput(\"Order saving is working.\");\n}\n";
